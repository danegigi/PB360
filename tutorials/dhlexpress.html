# DHL Express on Shipping360

> Read [Shipping360 Basics](00-basics.html) first — auth, headers, rating, label creation, cancel, and manifest are identical across carriers. This page covers only what is **DHL Express-specific**.

DHL Express is a global courier for time-definite international express. In Shipping360 it is `carrierID: DHLEXP`: rate, create label, reprint, void, and track.

## At a Glance

| | |
|---|---|
| `carrier` / `carrierID` value | `DHLEXP` |
| Best for | International express (time-definite) |
| Rate model | **Bring your own DHL Express account** (negotiated tariffs) |
| Account onboarding | Carrier Accounts API (`carrierID: "DHLEXP"`) |
| Region | Global; country-pair dependent |

---

## Geography

International express focus — global outbound/inbound, with capabilities that are country-pair dependent (PB exposes origin/destination via metadata).

---

## Service / Parcel / Special-Service Codes

> **Not published by PB** — the DHL Express page shows "Metadata information not available." Retrieve at runtime via the metadata APIs. **Do not hard-code.** DHL's product families (Express Worldwide, Express 12:00 / 9:00, Economy Select) and value-added services (Insurance, GoGreen) come from DHL's own MyDHL reference data; the PB-mapped codes are account/country-driven.

---

## Label Formats & Sizes

Not specified on the PB DHLEXP page. PB's Shipping/Print API governs document type/size generally; confirm PDF/ZPL and 4x6/A4 support via the [Print API](https://docs.shipping360.pitneybowes.com/openapi/shipping/print). Upstream MyDHL supports PDF labels fit-to-A4.

---

## Connecting a DHL Express Account

Bring-your-own-account, via the Carrier Accounts API:

```text
POST {shippingUrl}/api/v1/carrierAccounts
```

```json
{
  "carrierID": "DHLEXP",
  "accountNumber": "YOUR_DHL_ACCOUNT",
  "description": "DHLEXP by API",
  "carrierAccountType": "Shipping",
  "provisioningType": "API",
  "parameters": {
    "username": "YOUR_DHL_API_USERNAME",
    "password": "YOUR_DHL_API_PASSWORD"
  }
}
```

- Prerequisites: a DHL Express **customer account number** + **API security credentials** (username/password).
- The response returns a `carrierAccountID` used in `byCarrier.carrierAccountId`.

**Getting a DHL Express account + API access:**
- Existing customers: log in to the [DHL Developer Portal](https://developer.dhl.com/) → "Get Access" for the MyDHL API.
- New customers: request an account at [mydhl open account](https://mydhl.express.dhl/gb/en/ship/open-account.html); DHL sets it up, then request API access.
- DHL API environments: test (`express.api.dhl.com/mydhlapi/test`, ~500 calls/day) and production (`/mydhlapi`), Basic Auth.

---

## Rate Cards / Own-Account Requirements

Requires the **merchant's own DHL Express account** — rates returned are that account's negotiated tariffs. PB does not resell DHL Express; there is no PB-provided rate card. Billing/duties-payor (DDP/DDU/third-party) is handled at **shipment time** (carrierPayments in the Shipping API), not during carrier onboarding.

---

## International Customs & ETD

- International non-document shipments require **customs/export-declaration data** (`customs` object — see Basics).
- **ETD (Electronic Trade Documents):** supported via PB's [Upload ETD endpoint](https://docs.shipping360.pitneybowes.com/openapi/shipping/electronic-trade-document); confirm ETD is enabled for DHLEXP on your account.
- Documents-only shipments: supported upstream in DHL (customs optional for non-declarable) but **not explicitly confirmed on the PB DHLEXP page** — verify.

---

## Gotchas

- PB DHLEXP metadata (services/parcels/special/formats) is account/country-driven — fetch at runtime; don't hard-code.
- International shipments need clean customs data.
- Rating is indicative; final rate/transit may differ per DHL terms.
- `carrierAccountId` must match the location resolved by `X-PB-LocationId`.
